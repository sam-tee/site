<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{{ config.description }}">
<link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
<style>
:root{--f-serif:Georgia,'Times New Roman',serif;--f-sans:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#101010;--border:#323232;--muted:#8a8a8a;--fg:#e7e7e7;--fg-bright:#ffffff;--warm1:#F89777;--warm2:#F8D353;--accent-ink:#F89777}
html[data-theme="light"]{--bg:#f0f0f0;--border:#d4d4d4;--muted:#545454;--fg:#2b2b2b;--fg-bright:#101010;--warm1:#8D3213;--warm2:#8D3213;--accent-ink:#8D3213}
*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-serif);line-height:1.65;overflow-wrap:break-word}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem;padding-left:max(1.25rem,env(safe-area-inset-left));padding-right:max(1.25rem,env(safe-area-inset-right))}
header{background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid transparent}
header.scrolled{border-bottom-color:var(--border)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem;flex-wrap:wrap}
@media(max-width:640px){.wrap{padding:0 1.5rem;padding-left:max(1.5rem,env(safe-area-inset-left));padding-right:max(1.5rem,env(safe-area-inset-right))}.hd{gap:.6rem}nav{gap:.35rem}}
@media(max-width:380px){.mono{width:2.2rem;height:2.2rem}nav a,.iconbtn{width:2rem;height:2rem}nav a.cvlink{padding:0 .7rem}}
.hd>*{min-width:0}
nav{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.brand{font-family:var(--f-sans);font-weight:800;font-size:1rem;color:var(--fg-bright);text-decoration:none}
.mono{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border:2px solid var(--fg-bright);letter-spacing:.02em}
.brand:hover .mono{border-color:var(--accent-ink);color:var(--accent-ink)}
nav a,.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;border:1px solid var(--border);border-radius:0;background:transparent;color:var(--fg);text-decoration:none;cursor:pointer}
nav a:hover,.iconbtn:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.skip{position:absolute;left:1rem;top:-4rem;z-index:20;background:var(--fg-bright);color:var(--bg);font-family:var(--f-sans);font-size:.85rem;font-weight:700;padding:.6rem 1rem;text-decoration:none}
.skip:focus{top:.6rem}
main:focus{outline:none}
nav svg{width:1rem;height:1rem}
#theme-toggle{font:inherit}
html[data-theme="dark"] .icon-moon{display:none}
html[data-theme="light"] .icon-sun{display:none}
nav a.cvlink{width:auto;height:2.1rem;border-radius:0;padding:0 .9rem;font-family:var(--f-sans);font-size:.82rem;font-weight:700;letter-spacing:.12em}
main{padding:1.2rem 0 3rem}
h1,h2,h3{font-family:var(--f-sans);color:var(--fg-bright);line-height:1.25}
h1.title{font-size:2.2rem;margin:.3rem 0 .6rem;color:var(--accent-ink)}
.lede{font-size:1.12rem;color:var(--fg)}
.kicker{font-family:var(--f-sans);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.actions{display:flex;gap:.5rem;margin:1.1rem 0 0}
.actions a{display:inline-flex;align-items:center;justify-content:center;width:2.3rem;height:2.3rem;border-radius:0;border:1px solid var(--border);color:var(--fg);text-decoration:none}
.actions a:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
.actions svg{width:1.05rem;height:1.05rem}
.rule{border:0;border-top:1px solid var(--border);margin:2rem 0}
section.block{margin:1.8rem 0}
section.block h2:not(.eyebrow){font-size:1.15rem;margin:0 0 .4rem}
section.block p,section.block li{font-size:.98rem}
section.block ul{padding-left:1.2rem;margin:.4rem 0}
section.block li{margin:.25rem 0}
a{color:var(--accent-ink)}footer{border-top:1px solid var(--border);padding:1.2rem 0 2rem;color:var(--muted);font-family:var(--f-sans);font-size:.82rem}
.prose ul{padding-left:1.2rem}.prose li{margin:.3rem 0}
.prose h2{font-size:1.15rem;border-top:1px solid var(--border);padding-top:1.4rem;margin-top:1.8rem}
.prose>h2:first-child{border-top:0;padding-top:0;margin-top:1.2rem}
section.block.divided{border-top:1px solid var(--border);padding-top:1.6rem}
.draft{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68rem;letter-spacing:.06em;border:1px solid var(--border);border-radius:0;padding:.05rem .45rem;margin-left:.5rem;color:var(--muted);vertical-align:middle}
.projlink{font-family:var(--f-sans);font-size:.85rem}
.actions .cvpill{width:auto;height:2.3rem;border-radius:0;padding:0 1.1rem;font-family:var(--f-sans);font-size:.85rem;font-weight:700;letter-spacing:.1em}
.cv-head{display:grid;grid-template-columns:6.5rem minmax(0,1fr) auto;gap:1.5rem;align-items:center;padding:1.6rem 0;border-top:3px solid var(--fg-bright);border-bottom:3px solid var(--fg-bright);margin-bottom:2rem}
.photo{width:6.5rem;height:6.5rem;border-radius:0;border:2px solid var(--accent-ink);display:grid;place-items:center;font-family:var(--f-sans);font-weight:800;font-size:1.7rem;color:var(--accent-ink);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.cv-head .who{text-align:center}
.cv-head .who h1.title{margin:.1rem 0 .3rem}
.cv-head .who p{margin:.15rem 0;font-family:var(--f-sans);font-size:.88rem;color:var(--muted)}
.cv-dl{display:inline-flex;align-items:center;justify-content:center;width:3.2rem;height:3.2rem;border-radius:0;border:2px solid var(--accent-ink);color:var(--accent-ink);text-decoration:none}
.cv-dl:hover{background:var(--accent-ink);color:var(--bg)}
.cv-dl svg{width:1.3rem;height:1.3rem}
@media(max-width:560px){.cv-head{grid-template-columns:1fr;text-align:center}.photo{margin:0 auto}.cv-dl{margin:0 auto}}
.masthead{border-top:3px solid var(--fg-bright);border-bottom:3px solid var(--fg-bright);text-align:center;padding:1.2rem 0;margin:0}
.masthead .eyebrow{margin:.6rem 0 0}
.masthead h1.title{font-size:clamp(2.4rem,6vw,3.4rem);font-weight:400;letter-spacing:-.01em}
.deck{font-style:italic;color:var(--muted);font-size:1.15rem;margin:.4rem 0 0}
.eyebrow{font-family:var(--f-sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:1em 0}
.roman{font-style:italic;color:var(--muted);font-size:1.35em;margin-right:.5rem}
.worklink{color:var(--fg-bright);text-decoration:none}
.worklink:hover{color:var(--accent-ink)}
.worklink .arr{color:var(--accent-ink);font-style:normal}
.creds{display:grid;grid-template-columns:1fr 1fr;gap:1rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.9rem 0;margin:1.2rem 0;font-family:var(--f-sans);font-size:.85rem}
.creds dt{font-weight:700}.creds dd{margin:.1rem 0 0;color:var(--muted)}
.margin{display:grid;grid-template-columns:minmax(0,1fr) 11rem;gap:2rem}
.margin aside{font-family:var(--f-sans);font-size:.8rem;color:var(--muted);border-top:2px solid var(--accent-ink);padding-top:.5rem;align-self:start}
.margin aside p{margin:.2rem 0 .8rem}
@media(max-width:700px){.margin{grid-template-columns:1fr}.margin aside{border-top:0;border-left:2px solid var(--accent-ink);padding:.1rem 0 .1rem .8rem}}
.folio{display:grid;grid-template-columns:10rem minmax(0,1fr);gap:2.5rem}
.toc{position:sticky;top:4.5rem;align-self:start;font-family:var(--f-sans);font-size:.82rem}
.toc .toc-h{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:.3rem}
.toc a{display:flex;gap:.6rem;text-decoration:none;color:var(--fg);padding:.55rem 0;border-bottom:1px solid var(--border)}
.toc a span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.7rem;color:var(--muted)}
.toc a:hover{color:var(--accent-ink)}
@media(max-width:700px){.folio{grid-template-columns:1fr}.toc{position:static;display:flex;flex-wrap:wrap;gap:0 1.2rem;align-items:baseline}.toc .toc-h{flex-basis:100%}.toc a{border:0;padding:.3rem 0}}
.dropcap::first-letter{font-size:3.3em;float:left;line-height:.85;padding-right:.12em;color:var(--accent-ink)}
.pull{border-left:3px solid var(--accent-ink);margin:1.8rem 0;padding:.2rem 0 .2rem 1rem;font-style:italic;font-size:1.3rem;line-height:1.5;color:var(--fg-bright)}
.notes{font-size:.85rem;color:var(--muted)}
.notes li{margin:.25rem 0}
.tl{margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--border);font-size:.95rem}
.tl .when{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;color:var(--muted);padding-top:.25rem}
.tl strong{font-family:var(--f-sans);color:var(--fg-bright)}
@media(max-width:560px){.tl li{grid-template-columns:1fr;gap:.1rem}.creds{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap hd">
<a class="brand" href="{{ get_url(path='@/_index.md') }}" title="{{ config.extra.name }} — home" aria-label="{{ config.extra.name }} — home"><span class="mono">ST</span></a>
<nav>
<a href="mailto:{{ config.extra.email }}" title="Email {{ config.extra.email }}" aria-label="Email"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>
<a href="{{ config.extra.git_url }}" title="git.akhlus.uk" aria-label="Git server"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4.5-6 3.5-9 5.5"/></svg></a>
<a class="cvlink" href="{{ get_url(path='@/cv.md') }}" title="Curriculum vitae" aria-label="Curriculum vitae">CV</a>
<button id="theme-toggle" class="iconbtn" onclick="toggleTheme()" title="Toggle light/dark" aria-label="Toggle light/dark" aria-pressed="false"><svg aria-hidden="true" class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg aria-hidden="true" class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</nav>
</div></header>
<main id="main" tabindex="-1"><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer><div class="wrap">© {{ config.extra.name }} · <a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a> · <a href="{{ config.extra.git_url }}">git.akhlus.uk</a> · {{ config.extra.variant }}</div></footer>
<script>(function(){var s=null;try{s=localStorage.getItem('theme')}catch(e){};var m=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=s||m;var btn=document.getElementById('theme-toggle');function syncBtn(t){if(!btn)return;var light=t==='light';btn.setAttribute('aria-pressed',light?'true':'false');var l='Switch to '+(light?'dark':'light')+' mode';btn.setAttribute('aria-label',l);btn.setAttribute('title',l);}syncBtn(document.documentElement.dataset.theme);window.toggleTheme=function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}syncBtn(n);};var hd=document.querySelector('header');var rule=document.querySelector('.masthead');function onS(){var show;if(rule&&hd){show=rule.getBoundingClientRect().top+4<hd.offsetHeight;}else{show=window.scrollY>8;}if(hd)hd.classList.toggle('scrolled',show);}window.addEventListener('scroll',onS,{passive:true});onS();})();</script>
</body>
</html>
