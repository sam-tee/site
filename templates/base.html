<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{% if page and page.description %}{{ page.description }}{% elif section and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
{% block robots %}<meta name="robots" content="index, follow">{% endblock %}
<meta name="author" content="{{ config.extra.author }}">
<meta name="theme-color" content="#101010">
{% block canonical %}<link rel="canonical" href="{% if current_url %}{{ current_url | safe }}{% else %}{{ config.base_url | safe }}{% endif %}">{% endblock %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ config.title }}">
<meta property="og:title" content="{% block ogtitle %}{{ config.title }}{% endblock %}">
<meta property="og:description" content="{% if page and page.description %}{{ page.description }}{% elif section and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
{% block ogurl %}<meta property="og:url" content="{% if current_url %}{{ current_url | safe }}{% else %}{{ config.base_url | safe }}{% endif %}">{% endblock %}
<meta property="og:image" content="{{ get_url(path='social-preview.png') }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Peach ST monogram in a square frame on a dark background">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twittertitle %}{{ config.title }}{% endblock %}">
<meta name="twitter:description" content="{% if page and page.description %}{{ page.description }}{% elif section and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
<meta name="twitter:image" content="{{ get_url(path='social-preview.png') }}">
<meta name="twitter:image:alt" content="Peach ST monogram in a square frame on a dark background">
<link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path='apple-touch-icon.png') }}">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body{% block bodyclass %}{% endblock %}>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap hd">
<a class="brand" href="{{ get_url(path='@/_index.md') }}" title="{{ config.extra.name }} — home" aria-label="{{ config.extra.name }} — home"><span class="mono">ST</span></a>
<nav>
<a href="mailto:{{ config.extra.email }}" title="Email {{ config.extra.email }}" aria-label="Email"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>
<a href="{{ config.extra.git_url }}" title="git.akhlus.uk" aria-label="Git server"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7"/><path d="M18 10.5c0 4.5-6 3.5-9 5.5"/></svg></a>
<a class="cvlink" href="{{ get_url(path='@/cv.md') }}" title="Curriculum vitae" aria-label="Curriculum vitae">CV</a>
<button id="theme-toggle" class="iconbtn" hidden title="Toggle light/dark" aria-label="Toggle light/dark" aria-pressed="false"><svg aria-hidden="true" class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg aria-hidden="true" class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</nav>
</div></header>
<main id="main" tabindex="-1"><div class="wrap">{% block content %}{% endblock %}{% block endrule %}<hr class="rule rule-end">{% endblock %}</div></main>
<footer><div class="wrap ft"><span>© {{ config.extra.name }}</span><span class="ft-links"><a href="{{ config.extra.source_url }}">Source</a><a class="ft-small" href="{{ get_url(path='@/privacy.md') }}">Privacy</a></span></div></footer>
</body>
</html>
